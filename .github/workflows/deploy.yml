name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: true

# CI (.github/workflows/ci.yml) is the quality gate on the same push.
# Render and Vercel build from the repository/Dockerfile themselves, so we
# only trigger their deploy hooks here; pushing unused GHCR images only added
# a third secret and a source of drift.
jobs:
  deploy-render:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render deploy (web + worker, preDeploy runs alembic)
        run: |
          curl --fail --silent --show-error -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

  deploy-vercel:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Vercel production deploy
        run: |
          npx vercel --token=${{ secrets.VERCEL_TOKEN }} --prod --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

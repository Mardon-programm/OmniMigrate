{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "omnimigrate.fullname" . }}-app
  labels:
    {{- include "omnimigrate.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: ""
  ENCRYPTION_KEY: ""
  STRIPE_SECRET_KEY: ""
  OPENAI_API_KEY: ""
{{- end }}
---
{{- if not .Values.externalPostgres.auth.existingSecret }}
{{- /* Generate full DSN; password sourced from a separate key so operators
       can also inject it via external tooling (sealed-secrets, ESO). */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "omnimigrate.fullname" . }}-postgres
  labels:
    {{- include "omnimigrate.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: ""
  url: "postgresql+asyncpg://{{ .Values.externalPostgres.auth.username }}:CHANGE_ME@{{ .Values.externalPostgres.host }}:{{ .Values.externalPostgres.port }}/{{ .Values.externalPostgres.database }}"
{{- end }}

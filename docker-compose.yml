name: omnimigrate

services:
  redis:
    image: redis:7-alpine
    container_name: omnimigrate-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - omnimigrate-net

  backend:
    build:
      context: ./backend
      target: runtime
    container_name: omnimigrate-backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: "postgresql+asyncpg://neondb_owner:npg_4gGM3WHNRXPQ@ep-billowing-term-b5v1z7fz-pooler.c-7.us-east-2.aws.neon.tech/neondb?ssl=require"
      REDIS_URL: redis://redis:6379/0
      OPENAI_MODEL: "openai/gpt-oss-120b"
    depends_on:
      redis:
        condition: service_healthy
    command: sh -c 'echo "DATABASE_URL=$DATABASE_URL" && alembic upgrade heads && uvicorn app.main:app --host 0.0.0.0 --port 8003 --workers 2'
    ports:
      - "8003:8003"
    volumes:
      - workspace_data:/data
    networks:
      - omnimigrate-net

  worker:
    build:
      context: ./backend
      target: runtime
    container_name: omnimigrate-worker
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: "postgresql+asyncpg://neondb_owner:npg_4gGM3WHNRXPQ@ep-billowing-term-b5v1z7fz-pooler.c-7.us-east-2.aws.neon.tech/neondb?ssl=require"
      REDIS_URL: redis://redis:6379/0
      OPENAI_MODEL: "openai/gpt-oss-120b"
    depends_on:
      redis:
        condition: service_healthy
    command: ["python", "-m", "app.worker_runner"]
    volumes:
      - workspace_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/omnimigrate:/tmp/omnimigrate
    user: root
    networks:
      - omnimigrate-net

  frontend:
    build: ./frontend
    container_name: omnimigrate-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks:
      - omnimigrate-net

volumes:
  redis_data:
  workspace_data:

networks:
  omnimigrate-net:
    driver: bridge
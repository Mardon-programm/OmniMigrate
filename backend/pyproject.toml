[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "ASYNC",  # flake8-async
    "RUF",    # ruff-specific
]
ignore = [
    "B008",  # function call in default argument (FastAPI Depends pattern)
    "S101",  # assert allowed (tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S110", "BLE001", "PLR", "SIM105"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

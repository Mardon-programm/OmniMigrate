# docker-compose.prod.yml - For VPS self-hosting (alternative to Vercel/Render)
services:
  postgres:
    image: postgres:15-alpine
    container_name: omnimigrate-db
    environment:
      POSTGRES_DB: omnimigrate
      POSTGRES_USER: omnimigrate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnimigrate -d omnimigrate"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - omnimigrate-net

  redis:
    image: redis:7-alpine
    container_name: omnimigrate-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - omnimigrate-net

  backend:
    build:
      context: ./backend
      target: runtime
    container_name: omnimigrate-backend
    env_file:
      - ./backend/.env.prod
    environment:
      REDIS_URL: redis://redis:6379/0
    # Apply schema migrations before serving traffic.
    command: sh -c "alembic upgrade heads && uvicorn app.main:app --host 0.0.0.0 --port 8003 --workers 2"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - omnimigrate-net

  worker:
    build:
      context: ./backend
      target: runtime
    container_name: omnimigrate-worker
    env_file:
      - ./backend/.env.prod
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    command: ["python", "-m", "app.worker_runner"]
    restart: unless-stopped
    networks:
      - omnimigrate-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: omnimigrate-frontend
    # Caddy is the only public entrypoint on 80/443.
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - omnimigrate-net

  caddy:
    image: caddy:2-alpine
    container_name: omnimigrate-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - omnimigrate-net

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  omnimigrate-net:
    driver: bridge